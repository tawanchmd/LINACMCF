<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Recovery</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.card{width:min(430px,calc(100% - 40px));margin:10vh auto;background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:26px}label{display:flex;flex-direction:column;gap:7px}input,button{padding:11px;border:1px solid #cbd5e1;border-radius:9px}button{margin-top:12px;background:#172033;color:#fff;cursor:pointer}.hint{color:#64748b;font-size:13px;margin-top:12px}</style></head><body><div class="card"><h2>Password Recovery</h2><p class="hint">Submit a request to the System Admin. This page is isolated from the LINACMCF core workspace.</p><label>Account email<input id="email" type="email" autocomplete="email"></label><button id="send">Request password reset</button><div id="msg" class="hint"></div><p><a href="/">Back to sign in</a></p></div><script>send.onclick=async()=>{msg.textContent='Submitting…';try{let r=await fetch('/api/auth/password-recovery/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim()})}),j=await r.json();msg.textContent=j.message||'Request submitted.'}catch(e){msg.textContent='Unable to submit request.'}}</script></body></html>
