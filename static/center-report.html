<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Center Summary Report</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef2f7;color:#172033;margin:0}.wrap{max-width:1080px;margin:auto;padding:24px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px 16px;position:sticky;top:0;z-index:10}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.primary{background:#172033;color:#fff;border-color:#172033}.hint{color:#64748b;font-size:12px}.report-page{background:#fff;min-height:277mm;margin:18px auto;padding:18mm 17mm;border:1px solid #dbe3ee;box-shadow:0 8px 24px #0f172a12;position:relative}.report-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #172033;padding-bottom:12px;margin-bottom:18px}.report-head h1{font-size:24px;margin:0}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b}.meta{text-align:right;font-size:11px;color:#64748b}.grid4,.grid3,.grid2{display:grid;gap:10px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.kpi,.box{border:1px solid #dbe3ee;border-radius:10px;padding:12px}.kpi span,.label{display:block;color:#64748b;font-size:11px}.kpi strong{display:block;font-size:20px;margin-top:4px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 9px}.section h3{font-size:13px;margin:12px 0 6px}.bar{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;background:#475569}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:7px 6px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.table th{background:#f8fafc}.callout{padding:12px 14px;border-left:4px solid #475569;background:#f8fafc;font-size:12px;line-height:1.5}.declaration{font-size:11px;line-height:1.55;color:#475569}.footer{position:absolute;left:17mm;right:17mm;bottom:10mm;display:flex;justify-content:space-between;border-top:1px solid #e5e7eb;padding-top:6px;font-size:9px;color:#94a3b8}.empty{color:#94a3b8;font-style:italic}.screen-only{display:block}@media(max-width:760px){.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.report-page{min-height:auto;padding:20px}.meta{text-align:left}.report-head{flex-direction:column}.footer{position:static;margin-top:24px}}
@page{size:A4;margin:0}@media print{body{background:#fff}.screen-only{display:none!important}.wrap{max-width:none;padding:0}.report-page{width:210mm;height:297mm;min-height:297mm;margin:0;border:0;box-shadow:none;page-break-after:always;break-after:page;overflow:hidden}.report-page:last-child{page-break-after:auto;break-after:auto}}
</style></head>
<body><div class="wrap">
<div class="toolbar screen-only"><div><strong>Center Report / PDF</strong><div class="hint">Read-only workspace · server snapshot</div></div><div class="toolbar-actions"><select id="machineFilter"><option value="">All machines</option></select><button onclick="location.href='/'">Back to Core App</button><button class="primary" id="pdfBtn">Print / Save PDF</button></div></div>
<div id="status" class="hint screen-only" style="padding:10px 2px">Loading center snapshot…</div>
<div id="report"></div>
</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=(v,d=0)=>Number.isFinite(+v)?(+v).toLocaleString(undefined,{maximumFractionDigits:d}):'—', pct=v=>Number.isFinite(+v)?num(+v,0)+'%':'—', norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
let SNAP=null;
function obj(v){if(v&&typeof v==='object')return v;if(!v)return {};try{return JSON.parse(v)}catch{return {}}}
function machineRows(){if(!SNAP)return[];const ms=obj(SNAP.payload?.machines),ck=norm(SNAP.center?.name);let rows=Object.values(ms).filter(m=>norm(m.centerKey||m.center)===ck);const f=$('machineFilter').value;return f?rows.filter(m=>String(m.machine||'')===f):rows}
function centerData(){const cs=obj(SNAP.payload?.centers),ck=norm(SNAP.center?.name);return cs[ck]||Object.values(cs).find(c=>norm(c.center)===ck)||{}}
function histories(){const hs=SNAP?.payload?.histories||{}, out=[];for(const [k,v] of Object.entries(hs)){const h=obj(v);for(const [date,x] of Object.entries(h))if(x&&typeof x==='object')out.push({date,newPatients:+x.newPatients||0,activePatients:+x.activePatients||0,key:k})}return out.sort((a,b)=>a.date.localeCompare(b.date))}
function pageHead(n,title,id,ts){return '<div class="report-head"><div><div class="eyebrow">LINAC Machine Carrying Capacity · Center Summary Report</div><h1>'+esc(title)+'</h1></div><div class="meta">Report ID: '+esc(id)+'<br>Generated: '+esc(ts)+'<br>Page '+n+' / 5</div></div>'}
function footer(){return '<div class="footer"><span>Read-only report generated from authenticated center snapshot</span><span>LINACMCF v5.3</span></div>'}
function render(){
 const c=centerData(), ms=machineRows(), allH=histories(), sa=c.serviceArea||{}, pop=c.population||{}, provinces=sa.provinces||[];
 const capacity=ms.reduce((z,m)=>z+(+m.computed?.annualCases||0),0), daily=ms.reduce((z,m)=>z+(+m.computed?.daily||+m.computed?.dailyCap||0),0);
 const demand=(+pop.population||0)*(+pop.incidence||0)/100000*(+pop.rtRate||0);
 const recent=allH.slice(-20), avgActive=recent.length?recent.reduce((z,x)=>z+x.activePatients,0)/recent.length:null, util=avgActive!=null&&daily>0?avgActive/daily*100:null;
 const recentNew=allH.slice(-60), monthlyNew=recentNew.length?recentNew.reduce((z,x)=>z+x.newPatients,0)/Math.max(1,new Set(recentNew.map(x=>x.date.slice(0,7))).size):null;
 const annualized=monthlyNew==null?null:monthlyNew*12, balance=capacity-demand, coverage=demand>0?capacity/demand*100:null;
 const id='CTR-'+String(SNAP.center?.id||'NA')+'-'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14), ts=new Date().toLocaleString();
 const rows=ms.map(m=>{const i=m.machineInputs||{},q=m.computed||{};return '<tr><td>'+esc(m.machine||'Unnamed')+'</td><td>'+num(i.op,0)+'</td><td>'+num(i.idle,0)+'</td><td>'+pct((+i.eff||0)*100)+'</td><td>'+num(i.avgFrac,1)+'</td><td>'+num(q.daily||q.dailyCap,1)+'</td><td>'+num(q.annualCases,0)+'</td></tr>'}).join('');
 const prov=provinces.length?provinces.map(esc).join(', '):'No provinces declared';
 const interpretation=coverage==null?'Insufficient demand data for capacity comparison.':coverage<100?'Modeled annual treatment capacity is below estimated annual RT demand for the declared service population.':coverage<120?'Modeled capacity is close to estimated demand, with limited modeled reserve.':'Modeled capacity exceeds estimated demand, indicating modeled reserve capacity.';
 const forecast=annualized==null?'Insufficient recent daily history for a workload run-rate estimate.':'Recent recorded new-patient run rate annualizes to approximately '+num(annualized,0)+' patients/year. This is a descriptive run-rate, not a clinical demand forecast.';
 $('report').innerHTML=
 '<section class="report-page">'+pageHead(1,'Executive Summary',id,ts)+'<div class="grid4"><div class="kpi"><span>Center</span><strong>'+esc(SNAP.center?.name||'—')+'</strong></div><div class="kpi"><span>Machines</span><strong>'+num(ms.length)+'</strong></div><div class="kpi"><span>Modeled capacity</span><strong>'+num(capacity)+'</strong><span>courses/year</span></div><div class="kpi"><span>Estimated RT demand</span><strong>'+num(demand)+'</strong><span>courses/year</span></div></div><div class="section"><h2>Capacity position</h2><div class="grid3"><div class="kpi"><span>Capacity / demand</span><strong>'+pct(coverage)+'</strong></div><div class="kpi"><span>Modeled balance</span><strong>'+num(balance)+'</strong><span>courses/year</span></div><div class="kpi"><span>Recent utilization proxy</span><strong>'+pct(util)+'</strong></div></div></div><div class="section callout">'+esc(interpretation)+'</div>'+footer()+'</section>'+
 '<section class="report-page">'+pageHead(2,'Service Area & Estimated Demand',id,ts)+'<div class="grid3"><div class="kpi"><span>Responsible population</span><strong>'+num(pop.population)+'</strong></div><div class="kpi"><span>Cancer incidence</span><strong>'+num(pop.incidence,1)+'</strong><span>per 100,000</span></div><div class="kpi"><span>RT proportion</span><strong>'+pct((+pop.rtRate||0)*100)+'</strong></div></div><div class="section"><h2>Declared service area</h2><div class="box">'+prov+'</div></div><div class="section"><h2>Demand derivation</h2><div class="callout">Estimated RT demand = population × cancer incidence / 100,000 × RT proportion.<br><strong>'+num(pop.population)+' × '+num(pop.incidence,1)+' / 100,000 × '+num((+pop.rtRate||0)*100,1)+'% = '+num(demand)+' courses/year</strong></div></div>'+footer()+'</section>'+
 '<section class="report-page">'+pageHead(3,'Machine Carrying Capacity',id,ts)+'<div class="section"><table class="table"><thead><tr><th>Machine</th><th>Op min/day</th><th>Idle min/day</th><th>Staff efficacy</th><th>Avg fractions</th><th>Cases/day</th><th>Cases/year</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">No machine data in snapshot.</td></tr>')+'</tbody></table></div><div class="section grid2"><div class="kpi"><span>Total modeled capacity</span><strong>'+num(capacity)+'</strong><span>courses/year</span></div><div class="kpi"><span>Selected machine scope</span><strong>'+esc($('machineFilter').value||'All machines')+'</strong></div></div>'+footer()+'</section>'+
 '<section class="report-page">'+pageHead(4,'Utilization & Forecast',id,ts)+'<div class="grid3"><div class="kpi"><span>Recent avg active patients</span><strong>'+num(avgActive,1)+'</strong></div><div class="kpi"><span>Modeled daily capacity</span><strong>'+num(daily,1)+'</strong></div><div class="kpi"><span>Utilization proxy</span><strong>'+pct(util)+'</strong></div></div><div class="section"><h2>Recent workload</h2><div class="callout">'+esc(forecast)+'</div></div><div class="section"><h2>Data coverage</h2><div class="box">'+num(allH.length)+' daily history records are present in the authenticated snapshot. Utilization uses up to the latest 20 records; run-rate uses up to the latest 60 records.</div></div>'+footer()+'</section>'+
 '<section class="report-page">'+pageHead(5,'Capacity & Logistic Interpretation',id,ts)+'<div class="section"><h2>Interpretation</h2><div class="callout">'+esc(interpretation)+'</div></div><div class="section"><h2>Data Declaration</h2><div class="declaration box">This report is a read-only rendering of the authenticated center workspace snapshot. Modeled capacity depends on user-entered operating time, idle time, treatment mix, cycle time, staffing efficacy, working days and average course fractions. Estimated demand depends on the declared service population, cancer incidence and RT proportion. Recent utilization and run-rate summaries depend on available daily history. These outputs are planning estimates and should not be interpreted as patient-level clinical guidance, audited national statistics, or guaranteed future workload.</div></div><div class="section"><h2>Snapshot provenance</h2><table class="table"><tr><th>Center</th><td>'+esc(SNAP.center?.name||'—')+'</td></tr><tr><th>Country</th><td>'+esc(SNAP.center?.country||'—')+'</td></tr><tr><th>Snapshot updated</th><td>'+esc(SNAP.snapshot_updated_at||'—')+'</td></tr><tr><th>Generated for role</th><td>'+esc(SNAP.generated_for?.role||'—')+'</td></tr></table></div>'+footer()+'</section>';
}
async function load(){const r=await fetch('/api/report/center-snapshot',{credentials:'same-origin'});if(r.status===401){location.href='/';return}if(!r.ok)throw new Error('HTTP '+r.status);SNAP=await r.json();const ms=obj(SNAP.payload?.machines),ck=norm(SNAP.center?.name);Object.values(ms).filter(m=>norm(m.centerKey||m.center)===ck).forEach(m=>{const o=document.createElement('option');o.value=m.machine||'';o.textContent=m.machine||'Unnamed machine';$('machineFilter').appendChild(o)});$('machineFilter').onchange=render;$('pdfBtn').onclick=()=>window.print();render();$('status').textContent='Ready · PDF uses the browser print dialog (A4, 5 pages).'}
load().catch(e=>$('status').textContent='Unable to load report snapshot: '+e.message);
</script></body></html>
