<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Center Summary Report</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#eef2f7;color:#172033;margin:0}.wrap{max-width:1080px;margin:auto;padding:24px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px 16px;position:sticky;top:0;z-index:10}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.primary{background:#172033;color:#fff;border-color:#172033}.hint{color:#64748b;font-size:12px}.report-page{background:#fff;min-height:277mm;margin:18px auto;padding:18mm 17mm;border:1px solid #dbe3ee;box-shadow:0 8px 24px #0f172a12;position:relative}.report-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #172033;padding-bottom:12px;margin-bottom:18px}.report-head h1{font-size:24px;margin:0}.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b}.meta{text-align:right;font-size:11px;color:#64748b}.grid4,.grid3,.grid2{display:grid;gap:10px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.kpi,.box{border:1px solid #dbe3ee;border-radius:10px;padding:12px}.kpi span,.label{display:block;color:#64748b;font-size:11px}.kpi strong{display:block;font-size:20px;margin-top:4px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 9px}.section h3{font-size:13px;margin:12px 0 6px}.bar{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;background:#475569}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:7px 6px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.table th{background:#f8fafc}.callout{padding:12px 14px;border-left:4px solid #475569;background:#f8fafc;font-size:12px;line-height:1.5}.declaration{font-size:11px;line-height:1.55;color:#475569}.footer{position:absolute;left:17mm;right:17mm;bottom:10mm;display:flex;justify-content:space-between;border-top:1px solid #e5e7eb;padding-top:6px;font-size:9px;color:#94a3b8}.empty{color:#94a3b8;font-style:italic}.report-chart{width:100%;height:220px;border:1px solid #e5e7eb;border-radius:10px}.equation{font-family:Georgia,serif;font-size:15px;padding:10px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px}.screen-only{display:block}@media(max-width:760px){.grid4,.grid3,.grid2{grid-template-columns:1fr 1fr}.report-page{min-height:auto;padding:20px}.meta{text-align:left}.report-head{flex-direction:column}.footer{position:static;margin-top:24px}}
@page{size:A4;margin:0}@media print{body{background:#fff}.screen-only{display:none!important}.wrap{max-width:none;padding:0}.report-page{width:210mm;height:297mm;min-height:297mm;margin:0;border:0;box-shadow:none;page-break-after:always;break-after:page;overflow:hidden}.report-page:last-child{page-break-after:auto;break-after:auto}}
</style></head>
<body><div class="wrap">
<div class="toolbar screen-only"><div><strong>Center Report / PDF</strong><div class="hint">Read-only workspace · server snapshot</div></div><div class="toolbar-actions"><select id="machineFilter"><option value="">All machines</option></select><button id="backToCoreBtn">Back to Core App</button><button class="primary" id="pdfBtn">Print / Save PDF</button></div></div>
<div id="status" class="hint screen-only" style="padding:10px 2px">Loading center snapshot…</div>
<div id="report"></div>
</div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=(v,d=0)=>Number.isFinite(+v)?(+v).toLocaleString(undefined,{maximumFractionDigits:d}):'—', pct=v=>Number.isFinite(+v)?num(+v,0)+'%':'—', norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
let SNAP=null;
function obj(v){if(v&&typeof v==='object')return v;if(!v)return {};try{return JSON.parse(v)}catch{return {}}}
function machineRows(){if(!SNAP)return[];const ms=obj(SNAP.payload?.machines),ck=norm(SNAP.center?.name);let rows=Object.values(ms).filter(m=>norm(m.centerKey||m.center)===ck);const f=$('machineFilter').value;return f?rows.filter(m=>String(m.machine||'')===f):rows}
function centerData(){const cs=obj(SNAP.payload?.centers),ck=norm(SNAP.center?.name);return cs[ck]||Object.values(cs).find(c=>norm(c.center)===ck)||{}}
function histories(){const hs=SNAP?.payload?.histories||{},out=[],f=$('machineFilter').value,needle=f?'histDaily|'+norm(SNAP.center?.name)+'|'+norm(f):'';for(const [k,v] of Object.entries(hs)){if(needle&&norm(k)!==norm(needle))continue;const h=obj(v);for(const [date,x] of Object.entries(h))if(x&&typeof x==='object')out.push({date,newPatients:+x.newPatients||0,activePatients:+x.activePatients||0,totalTreated:(x.totalTreated!==undefined&&x.totalTreated!==''?+x.totalTreated:(+x.newPatients||0)+(+x.activePatients||0)),key:k})}return out.sort((a,b)=>a.date.localeCompare(b.date))}
function pageHead(n,title,id,ts){return '<div class="report-head"><div><div class="eyebrow">LINAC Machine Carrying Capacity · Center Summary Report</div><h1>'+esc(title)+'</h1></div><div class="meta">Report ID: '+esc(id)+'<br>Generated: '+esc(ts)+'<br>Page '+n+' / 3</div></div>'}
function footer(){return '<div class="footer"><span>Read-only report generated from authenticated center snapshot</span><span>LINACMCF v5.4</span></div>'}
function fitLogistic(y,K){if(y.length<6||!K)return null;let best=null,eps=1e-6;for(let rr=.0005;rr<=1;rr+=.002){let logs=[];for(let i=0;i<y.length;i++){let v=Math.min(Math.max(y[i],eps),K*(1-eps)),z=K/v-1;if(z>0)logs.push(Math.log(z)+rr*i)}if(!logs.length)continue;let A=Math.exp(logs.reduce((a,b)=>a+b,0)/logs.length),p=y.map((_,i)=>K/(1+A*Math.exp(-rr*i))),rm=Math.sqrt(y.reduce((s,v,i)=>s+(v-p[i])**2,0)/y.length);if(!best||rm<best.rmse)best={K,r:rr,A,pred:p,rmse:rm}}return best}
function drawChart(id,actual,forecast,K,logistic){const cv=$(id);if(!cv)return;const dpr=window.devicePixelRatio||1,w=Math.max(600,cv.clientWidth||700),h=220;cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);const L=42,R=14,T=20,B=28,n=Math.max(2,actual.length+(forecast?.length||0)),vals=[...actual,...(forecast||[]),K||0,...(logistic||[])],mx=Math.max(10,...vals)*1.12,X=i=>L+i*(w-L-R)/(n-1),Y=v=>h-B-v*(h-T-B)/mx;x.font='10px Arial';x.strokeStyle='#e5e7eb';x.fillStyle='#64748b';for(let j=0;j<=4;j++){let v=mx*j/4,py=Y(v);x.beginPath();x.moveTo(L,py);x.lineTo(w-R,py);x.stroke();x.fillText(v.toFixed(0),5,py+3)}function line(a,start,stroke,dash=[]){if(!a?.length)return;x.strokeStyle=stroke;x.setLineDash(dash);x.lineWidth=2;x.beginPath();a.forEach((v,i)=>{let px=X(start+i),py=Y(v);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.setLineDash([])}line(actual,0,'#111827');if(forecast?.length)line([actual.at(-1),...forecast],actual.length-1,'#2563eb',[6,4]);if(K>0)line(Array(n).fill(K),0,'#dc2626',[4,4]);if(logistic?.length)line(logistic,0,'#7c3aed',[8,3]);x.fillStyle='#111827';x.fillText('Actual',L,12);x.fillStyle='#2563eb';x.fillText('Forecast',L+55,12);x.fillStyle='#dc2626';x.fillText('Capacity K',L+125,12);if(logistic?.length){x.fillStyle='#7c3aed';x.fillText('Logistic',L+205,12)}}
async function enrichCharts(allH,daily){const y=allH.map(x=>x.totalTreated),fit=fitLogistic(y,daily);let fc=[];if(y.length>=6)try{const r=await fetch('/api/forecast',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({series:y,horizon:20,seasonality:'auto'})});if(r.ok)fc=(await r.json()).forecast||[]}catch(e){}drawChart('reportForecastChart',y,fc,daily,null);const lf=fit?fit.pred.concat(Array.from({length:20},(_,j)=>fit.K/(1+fit.A*Math.exp(-fit.r*(y.length+j))))):[];drawChart('reportLogisticChart',y,[],daily,lf);const sug=$('reportSuggestedNew');if(sug){const m=machineRows()[0],af=Math.max(1,+m?.machineInputs?.avgFrac||1);sug.textContent=daily>0?'≤ '+Math.max(0,Math.floor((.9*daily)/af)):'—'}const eq=$('reportLogisticEquation');if(eq)eq.innerHTML=fit?'Fixed-K logistic: <b>N(t) = '+num(fit.K,1)+' / [1 + '+num(fit.A,3)+' e<sup>−'+num(fit.r,4)+'t</sup>]</b> &nbsp; · &nbsp; RMSE '+num(fit.rmse,2):'At least 6 working-day observations are required for fitted logistic parameters.'}
function render(){
 const c=centerData(), ms=machineRows(), allH=histories(), sa=c.serviceArea||{}, pop=c.population||{}, provinces=sa.provinces||[];
 const capacity=ms.reduce((z,m)=>z+(+m.computed?.annualCases||0),0), daily=ms.reduce((z,m)=>z+(+m.computed?.daily||+m.computed?.dailyCap||0),0);
 const demand=(+pop.population||0)*(+pop.incidence||0)/100000*(+pop.rtRate||0);
 const recent=allH.slice(-20), avgActive=recent.length?recent.reduce((z,x)=>z+x.activePatients,0)/recent.length:null, avgTreated=recent.length?recent.reduce((z,x)=>z+x.totalTreated,0)/recent.length:null, util=avgTreated!=null&&daily>0?avgTreated/daily*100:null;
 const recentNew=allH.slice(-60), monthlyNew=recentNew.length?recentNew.reduce((z,x)=>z+x.newPatients,0)/Math.max(1,new Set(recentNew.map(x=>x.date.slice(0,7))).size):null;
 const annualized=monthlyNew==null?null:monthlyNew*12, balance=capacity-demand, coverage=demand>0?capacity/demand*100:null;
 const id='CTR-'+String(SNAP.center?.id||'NA')+'-'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14), ts=new Date().toLocaleString();
 const rows=ms.map(m=>{const i=m.machineInputs||{},q=m.computed||{};return '<tr><td>'+esc(m.machine||'Unnamed')+'</td><td>'+num(i.op,0)+'</td><td>'+num(i.idle,0)+'</td><td>'+pct((+i.eff||0)*100)+'</td><td>'+num(i.avgFrac,1)+'</td><td>'+num(q.daily||q.dailyCap,1)+'</td><td>'+num(q.annualCases,0)+'</td></tr>'}).join('');
 const prov=provinces.length?provinces.map(esc).join(', '):'No provinces declared';
 const interpretation=coverage==null?'Insufficient demand data for capacity comparison.':coverage<100?'Modeled annual treatment capacity is below estimated annual RT demand for the declared service population.':coverage<120?'Modeled capacity is close to estimated demand, with limited modeled reserve.':'Modeled capacity exceeds estimated demand, indicating modeled reserve capacity.';
 const forecast=annualized==null?'Insufficient recent daily history for a workload run-rate estimate.':'Recent recorded new-patient run rate annualizes to approximately '+num(annualized,0)+' patients/year. This is a descriptive run-rate, not a clinical demand forecast.';
 $('report').innerHTML=
 '<section class="report-page">'+pageHead(1,'Center Capacity Overview',id,ts)+'<div class="grid4"><div class="kpi"><span>Center</span><strong>'+esc(SNAP.center?.name||'—')+'</strong></div><div class="kpi"><span>Machines</span><strong>'+num(ms.length)+'</strong></div><div class="kpi"><span>Modeled capacity</span><strong>'+num(capacity)+'</strong><span>courses/year</span></div><div class="kpi"><span>Estimated RT demand</span><strong>'+num(demand)+'</strong><span>courses/year</span></div></div><div class="section grid2"><div><h2>Service Area & Estimated Demand</h2><div class="grid3"><div class="kpi"><span>Population</span><strong>'+num(pop.population)+'</strong></div><div class="kpi"><span>Incidence</span><strong>'+num(pop.incidence,1)+'</strong><span>/100,000</span></div><div class="kpi"><span>RT proportion</span><strong>'+pct((+pop.rtRate||0)*100)+'</strong></div></div><div class="box" style="margin-top:8px">'+prov+'</div></div><div><h2>Capacity position</h2><div class="grid2"><div class="kpi"><span>Capacity / demand</span><strong>'+pct(coverage)+'</strong></div><div class="kpi"><span>Balance</span><strong>'+num(balance)+'</strong><span>courses/year</span></div></div><div class="callout" style="margin-top:8px">'+esc(interpretation)+'</div></div></div><div class="section"><h2>Machine Carrying Capacity</h2><table class="table"><thead><tr><th>Machine</th><th>Op min/day</th><th>Idle min/day</th><th>Staff efficacy</th><th>Avg fractions/course</th><th>Fractions/day</th><th>Courses/year</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">No machine data in snapshot.</td></tr>')+'</tbody></table></div>'+footer()+'</section>'+
 '<section class="report-page">'+pageHead(2,'Utilization & Forecast',id,ts)+'<div class="grid4"><div class="kpi"><span>Avg delivered fractions/day</span><strong>'+num(avgTreated,1)+'</strong></div><div class="kpi"><span>Capacity fractions/day</span><strong>'+num(daily,1)+'</strong></div><div class="kpi"><span>Treatment utilization</span><strong>'+pct(util)+'</strong></div><div class="kpi"><span>Suggested new starts/day</span><strong id="reportSuggestedNew">—</strong></div></div><div class="section"><h2>Forecast chart · delivered fractions/day</h2><canvas id="reportForecastChart" class="report-chart"></canvas></div><div class="section"><h2>Recent workload</h2><div class="callout">'+esc(forecast)+'</div></div><div class="section"><h2>Data coverage</h2><div class="box">'+num(allH.length)+' daily history records are present in the selected machine scope.</div></div>'+footer()+'</section>'+
 '<section class="report-page">'+pageHead(3,'Capacity & Logistic Interpretation',id,ts)+'<div class="section"><h2>Logistic fit · delivered fractions/day</h2><canvas id="reportLogisticChart" class="report-chart"></canvas><div id="reportLogisticEquation" class="equation" style="margin-top:9px">Calculating logistic fit…</div></div><div class="section"><h2>Interpretation</h2><div class="callout">'+esc(interpretation)+'</div></div><div class="section"><h2>Data Declaration</h2><div class="declaration box">This report is a read-only rendering of the authenticated center workspace snapshot. Outputs are planning estimates and not patient-level clinical guidance or guaranteed future workload.</div></div><div class="section"><h2>Snapshot provenance</h2><table class="table"><tr><th>Center</th><td>'+esc(SNAP.center?.name||'—')+'</td></tr><tr><th>Country</th><td>'+esc(SNAP.center?.country||'—')+'</td></tr><tr><th>Snapshot updated</th><td>'+esc(SNAP.snapshot_updated_at||'—')+'</td></tr><tr><th>Generated for role</th><td>'+esc(SNAP.generated_for?.role||'—')+'</td></tr></table></div>'+footer()+'</section>'; setTimeout(()=>enrichCharts(allH,daily),0);
}
async function load(){const r=await fetch('/api/report/center-snapshot',{credentials:'same-origin'});if(r.status===401){location.href='/';return}if(!r.ok)throw new Error('HTTP '+r.status);SNAP=await r.json();const ms=obj(SNAP.payload?.machines),ck=norm(SNAP.center?.name);Object.values(ms).filter(m=>norm(m.centerKey||m.center)===ck).forEach(m=>{const o=document.createElement('option');o.value=m.machine||'';o.textContent=m.machine||'Unnamed machine';$('machineFilter').appendChild(o)});$('machineFilter').onchange=render;$('backToCoreBtn').onclick=()=>{if(history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin){history.back()}else{location.href='/'}};$('pdfBtn').onclick=()=>window.print();render();$('status').textContent='Ready · PDF uses the browser print dialog (A4, 3 pages).'}
load().catch(e=>$('status').textContent='Unable to load report snapshot: '+e.message);
</script></body></html>
